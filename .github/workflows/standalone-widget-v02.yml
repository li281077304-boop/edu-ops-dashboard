name: Standalone Widget V0.2 CI

on:
  push:
    branches:
      - feat/standalone-widget-v0.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python metrics and contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install project dependencies
        run: uv sync --extra excel --extra dev

      - name: Run Python tests
        run: uv run pytest

      - name: Run Ruff
        run: uv run ruff check .

  android:
    name: Android unit tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Run Android unit tests
        working-directory: android-widget
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: android-widget
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: standalone-widget-v0.2-debug-apk
          path: android-widget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

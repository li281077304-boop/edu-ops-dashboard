[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edu-ops-dashboard"
version = "0.1.0"
description = "校管家数据采集、标准化与经营指标引擎"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
collector = ["playwright>=1.45"]
excel = ["pandas>=2.0", "openpyxl>=3.1", "xlrd>=2.0"]
postgres = ["SQLAlchemy>=2.0", "psycopg[binary]>=3.2"]
dev = ["pytest>=8.0", "ruff>=0.6", "pre-commit>=3.7"]

[project.scripts]
edu-ops = "edu_ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
